name: Build S13 Training Camps

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

concurrency:
  group: s13-training-camps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and publish S13
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tags
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          image_tag="${commit_sha: -4}"
          echo "IMAGE_NAME=devopseasylearning/s13-training-camps" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${image_tag}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build --pull --tag "${IMAGE_NAME}:${IMAGE_TAG}" --tag "${IMAGE_NAME}:latest" .

      - name: Show built Docker image
        run: |
          set -euo pipefail
          echo "Built image: ${IMAGE_NAME}:${IMAGE_TAG}"
          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" --format 'Image ID: {{.Id}}'
          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" --format 'Platform: {{.Os}}/{{.Architecture}}'
          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" --format 'Size: {{.Size}} bytes'
          docker image ls "${IMAGE_NAME}"

      - name: Smoke-test container
        run: |
          set -euo pipefail
          docker run --detach --name s13-training-camps --publish 8080:8080 "${IMAGE_NAME}:${IMAGE_TAG}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null && \
               curl --fail --silent --show-error http://127.0.0.1:8080/api/courses >/dev/null; then
              echo "Container passed its health checks."
              docker rm --force s13-training-camps
              exit 0
            fi
            sleep 2
          done
          docker logs s13-training-camps
          docker rm --force s13-training-camps
          exit 1

      - name: Verify Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.docker_username }}
          DOCKER_TOKEN: ${{ secrets.docker_token }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKER_USERNAME" ]]; then
            echo "docker_username is missing. Add it to GitHub Actions secrets."
            exit 1
          fi
          if [[ -z "$DOCKER_TOKEN" ]]; then
            echo "docker_token is missing. Add it to GitHub Actions secrets."
            exit 1
          fi

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      - name: Publish Docker image
        run: |
          set -euo pipefail
          echo "Pushing devopseasylearning/s13-training-camps:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Pushing devopseasylearning/s13-training-camps:latest"
          docker push "${IMAGE_NAME}:latest"

      - name: Start and show published container
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
          docker rm --force s13-training-camps-published 2>/dev/null || true
          docker run --detach \
            --name s13-training-camps-published \
            --publish 18080:8080 \
            --volume s13-training-camps-data:/data \
            "${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Published container:"
          docker ps --filter name=s13-training-camps-published
          docker inspect s13-training-camps-published \
            --format 'Image: {{.Config.Image}} | Status: {{.State.Status}} | Ports: {{json .NetworkSettings.Ports}}'

          healthy=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/dev/null; then
              healthy=true
              curl --fail --silent --show-error http://127.0.0.1:18080/health
              break
            fi
            sleep 2
          done

          if [[ "$healthy" != true ]]; then
            echo "Container failed health check"
            docker logs s13-training-camps-published
            exit 1
          fi
